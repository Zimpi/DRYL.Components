name: Publish

# Continuous delivery for DRYL.Components.
#
# On every push to main we read <Version> from DRYL.Components.csproj.
# If no tag v<Version> exists yet, we build, test, pack and publish that
# version to nuget.org, then create the tag and a GitHub Release.
#
# The version is owned in the .csproj (bumped in the same commit as the change:
# feature -> minor, bugfix -> patch, breaking -> major). A push that does not
# change the version finds the tag already present and is a clean no-op.
#
# NOTE: publishing happens *inline* here, not by pushing a tag that triggers
# another workflow — a tag pushed with the default GITHUB_TOKEN does not fire
# further workflows (Actions' anti-recursion rule), so the tag route would
# silently publish nothing.
#
# Uses Trusted Publishing (OIDC) — no API key secret required. Configure the
# Trusted Publisher on nuget.org:
#   Owner -> Trusted Publishing -> GitHub Actions
#   Repository: DRYL.Components   Workflow File: publish.yml

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two pushes publish concurrently — serialize on main.
concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.decide.outputs.should_publish }}
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version from csproj
        id: read
        run: |
          version=$(grep -oPm1 '(?<=<Version>)[^<]+' DRYL.Components/DRYL.Components.csproj)
          if [ -z "$version" ]; then
            echo "::error::Could not read <Version> from DRYL.Components/DRYL.Components.csproj"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version in csproj: $version"

      - name: Decide whether to publish
        id: decide
        run: |
          tag="v${{ steps.read.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists — nothing to publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $tag is new — will publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Pack & Publish
    needs: check
    if: needs.check.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the tag + GitHub Release
      id-token: write   # required for OIDC trusted publishing
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET (8 / 9 / 10)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore DRYL.slnx

      - name: Build
        run: dotnet build DRYL.slnx -c Release --no-restore -p:Version=$VERSION

      - name: Test
        run: dotnet test DRYL.slnx -c Release --no-build --verbosity normal

      - name: Pack
        run: >
          dotnet pack DRYL.Components/DRYL.Components.csproj
          -c Release --no-build
          -p:Version=$VERSION
          -o artifacts

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Tag the release
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: DRYL.Components ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
