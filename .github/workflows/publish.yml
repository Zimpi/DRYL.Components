name: Publish

# Continuous delivery for the DRYL packages.
#
# Two packages ship independently from this one workflow:
#   * DRYL.Components         — version in code/DRYL.Components/DRYL.Components.csproj,
#                               released under the tag  v<version>
#   * DRYL.Components.Agents  — version in code/DRYL.Components.Agents/DRYL.Components.Agents.csproj,
#                               released under the tag  agents-v<version>
#
# On every push to main we read <Version> from each csproj. For each package, if
# no matching tag exists yet, we pack that version, publish it to nuget.org, then
# create the tag and a GitHub Release. Each package is evaluated on its own — one
# push can publish the core, the agents package, both, or neither (a no-op).
#
# The version of each package is owned in its own .csproj (bumped in the same
# commit as the change: feature -> minor, bugfix -> patch, breaking -> major).
#
# NOTE: publishing happens *inline* here, not by pushing a tag that triggers
# another workflow — a tag pushed with the default GITHUB_TOKEN does not fire
# further workflows (Actions' anti-recursion rule), so the tag route would
# silently publish nothing.
#
# Uses Trusted Publishing (OIDC) — no API key secret required. Configure the
# Trusted Publisher on nuget.org (one policy covers both packages because they
# publish from this same workflow file):
#   Owner -> Trusted Publishing -> GitHub Actions
#   Repository: DRYL.Components   Workflow File: publish.yml

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two pushes publish concurrently — serialize on main.
concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  check:
    name: Check versions
    runs-on: ubuntu-latest
    outputs:
      core_should_publish: ${{ steps.decide.outputs.core_should_publish }}
      core_version: ${{ steps.read.outputs.core_version }}
      agents_should_publish: ${{ steps.decide.outputs.agents_should_publish }}
      agents_version: ${{ steps.read.outputs.agents_version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read versions from csproj
        id: read
        run: |
          core=$(grep -oPm1 '(?<=<Version>)[^<]+' code/DRYL.Components/DRYL.Components.csproj)
          agents=$(grep -oPm1 '(?<=<Version>)[^<]+' code/DRYL.Components.Agents/DRYL.Components.Agents.csproj)
          if [ -z "$core" ]; then
            echo "::error::Could not read <Version> from code/DRYL.Components/DRYL.Components.csproj"
            exit 1
          fi
          if [ -z "$agents" ]; then
            echo "::error::Could not read <Version> from code/DRYL.Components.Agents/DRYL.Components.Agents.csproj"
            exit 1
          fi
          echo "core_version=$core" >> "$GITHUB_OUTPUT"
          echo "agents_version=$agents" >> "$GITHUB_OUTPUT"
          echo "Core version:   $core"
          echo "Agents version: $agents"

      - name: Decide whether to publish
        id: decide
        run: |
          core_tag="v${{ steps.read.outputs.core_version }}"
          agents_tag="agents-v${{ steps.read.outputs.agents_version }}"

          if git ls-remote --exit-code --tags origin "refs/tags/$core_tag" >/dev/null 2>&1; then
            echo "Tag $core_tag already exists — core is up to date."
            echo "core_should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $core_tag is new — will publish DRYL.Components."
            echo "core_should_publish=true" >> "$GITHUB_OUTPUT"
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$agents_tag" >/dev/null 2>&1; then
            echo "Tag $agents_tag already exists — agents is up to date."
            echo "agents_should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $agents_tag is new — will publish DRYL.Components.Agents."
            echo "agents_should_publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Pack & Publish
    needs: check
    if: needs.check.outputs.core_should_publish == 'true' || needs.check.outputs.agents_should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the tags + GitHub Releases
      id-token: write   # required for OIDC trusted publishing
    env:
      CORE_VERSION: ${{ needs.check.outputs.core_version }}
      AGENTS_VERSION: ${{ needs.check.outputs.agents_version }}
      CORE_PUBLISH: ${{ needs.check.outputs.core_should_publish }}
      AGENTS_PUBLISH: ${{ needs.check.outputs.agents_should_publish }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET (8 / 9 / 10)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore DRYL.slnx

      - name: Build
        run: dotnet build DRYL.slnx -c Release --no-restore

      - name: Test
        run: dotnet test DRYL.slnx -c Release --no-build --verbosity normal

      - name: Pack DRYL.Components
        if: env.CORE_PUBLISH == 'true'
        run: >
          dotnet pack code/DRYL.Components/DRYL.Components.csproj
          -c Release --no-build
          -o artifacts/core

      - name: Pack DRYL.Components.Agents
        if: env.AGENTS_PUBLISH == 'true'
        run: >
          dotnet pack code/DRYL.Components.Agents/DRYL.Components.Agents.csproj
          -c Release --no-build
          -o artifacts/agents

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push DRYL.Components to nuget.org
        if: env.CORE_PUBLISH == 'true'
        run: >
          dotnet nuget push "artifacts/core/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Push DRYL.Components.Agents to nuget.org
        if: env.AGENTS_PUBLISH == 'true'
        run: >
          dotnet nuget push "artifacts/agents/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Tag the core release
        if: env.CORE_PUBLISH == 'true'
        run: |
          git tag "v$CORE_VERSION"
          git push origin "v$CORE_VERSION"

      - name: Tag the agents release
        if: env.AGENTS_PUBLISH == 'true'
        run: |
          git tag "agents-v$AGENTS_VERSION"
          git push origin "agents-v$AGENTS_VERSION"

      - name: Create GitHub Release (DRYL.Components)
        if: env.CORE_PUBLISH == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.CORE_VERSION }}
          name: DRYL.Components ${{ env.CORE_VERSION }}
          generate_release_notes: true
          files: |
            artifacts/core/*.nupkg
            artifacts/core/*.snupkg

      - name: Create GitHub Release (DRYL.Components.Agents)
        if: env.AGENTS_PUBLISH == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: agents-v${{ env.AGENTS_VERSION }}
          name: DRYL.Components.Agents ${{ env.AGENTS_VERSION }}
          generate_release_notes: true
          files: |
            artifacts/agents/*.nupkg
            artifacts/agents/*.snupkg
